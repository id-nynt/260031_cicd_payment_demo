name: Payment Service CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: payment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U payment -d payment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://payment:payment@localhost:5432/payment
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: docker build --tag payment-service:${{ github.sha }} .

  security:
    name: Dependency and filesystem security
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Build and publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: self-hosted
    environment:
      name: staging
      url: http://localhost:3001
    env:
      COMPOSE_PROJECT_NAME: payment-staging
      APP_PORT: 3001
      POSTGRES_PORT: 5433
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      MERCHANT_NAME: Staging Merchant
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging Compose stack
        shell: pwsh
        run: docker compose up -d --build
      - name: Staging smoke test
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          $response = Invoke-WebRequest http://localhost:3001/health -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "Staging health check failed" }

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: self-hosted
    environment:
      name: production
      url: http://localhost:3000
    env:
      COMPOSE_PROJECT_NAME: payment-production
      APP_PORT: 3000
      POSTGRES_PORT: 5432
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      MERCHANT_NAME: Production Merchant
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Compose stack
        shell: pwsh
        run: docker compose up -d --build
      - name: Production smoke test
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          $response = Invoke-WebRequest http://localhost:3000/health -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "Production health check failed" }
