name: BDI Entity Execution
run-name: bdi-${{ inputs.execution_id }}
'on':
  workflow_call:
    inputs:
      entity:
        type: string
        required: true
      campaign_id:
        type: string
        required: true
      execution_id:
        type: string
        required: true
      attempt:
        type: string
        required: false
        default: '1'
      release_sha:
        type: string
        required: true
      failure_mode:
        type: string
        required: false
        default: none
      experiment_mode:
        type: string
        required: false
        default: normal
      report_only:
        type: boolean
        default: false
        required: false
    outputs:
      status:
        description: Confirmed selected job status
        value: ${{ jobs.report.outputs.status }}
  workflow_dispatch:
    inputs:
      entity:
        description: Logical entity selected by the BDI agent
        required: true
        type: choice
        options:
          - build
          - test
          - security
          - staging
          - production
          - rollback
      campaign_id:
        description: Controller campaign correlation ID
        required: true
        type: string
      execution_id:
        description: Unique BDI attempt identity
        required: true
        type: string
      attempt:
        description: BDI attempt number
        required: true
        type: string
      release_sha:
        description: Immutable application commit to execute
        required: true
        type: string
      failure_mode:
        description: Controlled experiment failure for this entity
        required: true
        default: none
        type: choice
        options:
          - none
          - force_failure
          - transient_failure
          - service_unavailable
          - infrastructure_failure
          - deployment_timeout
      experiment_mode:
        description: Payment behavior for the selected demo deployment
        required: true
        default: normal
        type: choice
        options:
          - normal
          - high_error_rate
          - request_faults
permissions:
  contents: read
  actions: read
concurrency:
  group: bdi-${{ inputs.campaign_id }}-${{ inputs.entity }}
  cancel-in-progress: false
jobs:
  build:
    name: Build entity
    if: inputs.entity == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controlled transient failure
        if: inputs.failure_mode == 'transient_failure'
        run: exit 1
      - name: Controlled experiment failure
        if: inputs.failure_mode == 'force_failure'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build --tag payment-service:${{ inputs.release_sha }} .
    continue-on-error: ${{ inputs.report_only == true }}
  test:
    name: Test entity
    if: inputs.entity == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U payment -d payment" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://payment:payment@localhost:5432/payment
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
    steps:
      - name: Controlled transient failure
        if: inputs.failure_mode == 'transient_failure'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Controlled experiment failure
        if: inputs.failure_mode == 'force_failure'
        run: exit 1
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s bdi-cicd-framework/parser -p 'test_*.py' -v
    continue-on-error: ${{ inputs.report_only == true }}
  security:
    name: Security entity
    if: inputs.entity == 'security'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Controlled transient failure
        if: inputs.failure_mode == 'transient_failure'
        run: exit 1
      - name: Controlled experiment failure
        if: inputs.failure_mode == 'force_failure'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
    continue-on-error: ${{ inputs.report_only == true }}
  staging:
    name: Staging entity
    if: inputs.entity == 'staging'
    runs-on:
      - self-hosted
      - linux
      - payment-deploy
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.failure_mode == 'deployment_timeout' && 1 || 20 }}
    environment: staging
    env:
      COMPOSE_PROJECT_NAME: payment-staging
      APP_PORT: 3001
      POSTGRES_PORT: 5433
      METRICS_PORT: 9465
      PROMETHEUS_PORT: 9091
      DEPLOYMENT_ENVIRONMENT: staging
      NODE_ENV: production
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      EXPERIMENT_MODE: ${{ inputs.experiment_mode }}
      CI_RUN_ID: ${{ inputs.execution_id }}
      MERCHANT_NAME: Staging Merchant
    steps:
      - name: Controlled transient failure
        if: inputs.failure_mode == 'transient_failure'
        run: exit 1
      - name: Controlled experiment failure
        if: inputs.failure_mode == 'force_failure'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Controlled deployment timeout before side effects
        if: inputs.failure_mode == 'deployment_timeout'
        run: sleep 90
      - name: Check runner tools
        run: docker info && docker compose version && curl --version
      - name: Deploy selected revision to staging
        run: docker compose up -d --build
      - name: Make deployment service unavailable
        if: inputs.failure_mode == 'service_unavailable'
        run: docker compose stop app
      - name: Stop deployment database infrastructure
        if: inputs.failure_mode == 'infrastructure_failure'
        run: docker compose stop postgres
      - name: Verify staging identity and readiness
        run: |
          for attempt in {1..12}; do
            if health=$(curl --fail --silent http://127.0.0.1:3001/health) &&
              grep -Fq "\"deploymentRunId\":\"${CI_RUN_ID}\"" <<< "$health" &&
              curl --fail --silent http://127.0.0.1:3001/ready; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail=100 app
          exit 1
      - name: Generate run-correlated telemetry
        env:
          PAYMENT_BASE_URL: http://127.0.0.1:3001
          PROMETHEUS_URL: http://127.0.0.1:9091
        run: |
          for attempt in {1..3}; do
            docker compose exec -T -e PAYMENT_BASE_URL=http://127.0.0.1:3000 app node --input-type=module - "$EXPERIMENT_MODE" 6 < scripts/generate-experiment-traffic.mjs
            sleep 5
          done
    continue-on-error: ${{ inputs.report_only == true }}
  production:
    name: Production entity
    if: inputs.entity == 'production'
    runs-on:
      - self-hosted
      - linux
      - payment-deploy
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.failure_mode == 'deployment_timeout' && 1 || 20 }}
    environment: production
    env:
      COMPOSE_PROJECT_NAME: payment-production
      APP_PORT: 3000
      POSTGRES_PORT: 5432
      METRICS_PORT: 9464
      PROMETHEUS_PORT: 9090
      DEPLOYMENT_ENVIRONMENT: production
      NODE_ENV: production
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      EXPERIMENT_MODE: ${{ inputs.experiment_mode }}
      CI_RUN_ID: ${{ inputs.execution_id }}
      MERCHANT_NAME: Production Merchant
    steps:
      - name: Controlled transient failure
        if: inputs.failure_mode == 'transient_failure'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Controlled deployment timeout before side effects
        if: inputs.failure_mode == 'deployment_timeout'
        run: sleep 90
      - name: Check runner tools
        run: docker info && docker compose version && curl --version
      - name: Deploy selected revision to production
        run: docker compose up -d --build
      - name: Make deployment service unavailable
        if: inputs.failure_mode == 'service_unavailable'
        run: docker compose stop app
      - name: Stop deployment database infrastructure
        if: inputs.failure_mode == 'infrastructure_failure'
        run: docker compose stop postgres
      - name: Controlled post-deployment failure
        if: inputs.failure_mode == 'force_failure'
        run: exit 1
      - name: Verify production identity, readiness, and telemetry
        run: |
          for attempt in {1..12}; do
            if health=$(curl --fail --silent http://127.0.0.1:3000/health) &&
              grep -Fq "\"deploymentRunId\":\"${CI_RUN_ID}\"" <<< "$health" &&
              curl --fail --silent http://127.0.0.1:3000/ready &&
              curl --fail --silent http://127.0.0.1:9464/metrics | grep -Fq payment_http_requests_total &&
              curl --fail --silent http://127.0.0.1:9090/-/ready; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail=100 app otel-collector prometheus
          exit 1
      - name: Generate production telemetry for BDI assessment
        run: |
          for attempt in {1..3}; do
            docker compose exec -T -e PAYMENT_BASE_URL=http://127.0.0.1:3000 app node --input-type=module - "$EXPERIMENT_MODE" 6 < scripts/generate-experiment-traffic.mjs
            sleep 5
          done
    continue-on-error: ${{ inputs.report_only == true }}
  rollback:
    name: Rollback entity
    if: inputs.entity == 'rollback'
    runs-on:
      - self-hosted
      - linux
      - payment-deploy
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.failure_mode == 'deployment_timeout' && 1 || 20 }}
    environment: production
    env:
      COMPOSE_PROJECT_NAME: payment-production
      APP_PORT: 3000
      POSTGRES_PORT: 5432
      METRICS_PORT: 9464
      PROMETHEUS_PORT: 9090
      DEPLOYMENT_ENVIRONMENT: production
      NODE_ENV: production
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      EXPERIMENT_MODE: normal
      CI_RUN_ID: ${{ inputs.execution_id }}
      MERCHANT_NAME: Production Merchant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Check runner tools
        run: docker info && docker compose version && curl --version
      - name: Controlled recovery failure
        if: inputs.failure_mode == 'force_failure'
        run: exit 1
      - name: Restore selected known-good source
        run: docker compose up -d --build
      - name: Verify restored execution identity and readiness
        run: |
          for attempt in {1..12}; do
            if health=$(curl --fail --silent http://127.0.0.1:3000/health) &&
              grep -Fq "\"deploymentRunId\":\"${CI_RUN_ID}\"" <<< "$health" &&
              curl --fail --silent http://127.0.0.1:3000/ready; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail=100 app
          exit 1
      - name: Generate restored-release telemetry for BDI verification
        run: |
          for attempt in {1..3}; do
            docker compose exec -T -e PAYMENT_BASE_URL=http://127.0.0.1:3000 app node --input-type=module - normal 6 < scripts/generate-experiment-traffic.mjs
            sleep 5
          done
    continue-on-error: ${{ inputs.report_only == true }}
  report:
    if: ${{ always() && inputs.report_only == true }}
    needs:
      - build
      - test
      - security
      - staging
      - production
      - rollback
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.inspect.outputs.status }}
    steps:
      - name: Read selected execution evidence
        id: inspect
        uses: actions/github-script@v7
        env:
          ENTITY: ${{ inputs.entity }}
        with:
          script: |-
            const names = {build:'Build entity',test:'Test entity',security:'Security entity',staging:'Staging entity',production:'Production entity',rollback:'Rollback entity'};
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {...context.repo, run_id:context.runId, attempt_number:Number(process.env.GITHUB_RUN_ATTEMPT), per_page:100});
            const selected = jobs.filter(j => j.name.endsWith(names[process.env.ENTITY]) && j.conclusion !== 'skipped' && j.started_at).sort((a,b)=>a.started_at.localeCompare(b.started_at)).at(-1);
            let status = 'unknown';
            if (selected && selected.status === 'completed') {
              if (selected.conclusion === 'timed_out') status = 'timeout';
              else if (selected.conclusion === 'cancelled') status = 'cancelled';
              else if (selected.steps.some(s => s.name === 'Controlled transient failure' && s.conclusion === 'failure')) status = 'transient_failure';
              else if (selected.steps.some(s => s.conclusion === 'failure') || selected.conclusion === 'failure') status = 'failure';
              else if (selected.conclusion === 'success') status = 'success';
            }
            core.setOutput('status',status);
            core.info(`Selected ${process.env.ENTITY}: ${status}`);
