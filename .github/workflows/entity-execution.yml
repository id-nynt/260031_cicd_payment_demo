name: BDI Entity Execution
run-name: bdi-${{ inputs.execution_id }}
'on':
  workflow_call:
    inputs:
      diagnostic_binding:
        type: string
        required: false
        default: '{}'
      target_execution_id:
        type: string
        required: false
        default: ''
      verification_seconds:
        type: string
        required: false
        default: '120'
      entity:
        type: string
        required: true
      campaign_id:
        type: string
        required: true
      execution_id:
        type: string
        required: true
      attempt:
        type: string
        required: false
        default: '1'
      release_sha:
        type: string
        required: true
      failure_mode:
        type: string
        required: false
        default: none
      experiment_mode:
        type: string
        required: false
        default: normal
  workflow_dispatch:
    inputs:
      diagnostic_binding:
        type: string
        required: false
        default: '{}'
      target_execution_id:
        type: string
        required: false
        default: ''
      verification_seconds:
        type: string
        required: false
        default: '120'
      entity:
        description: Logical entity selected by the BDI agent
        required: true
        type: choice
        options:
        - build
        - test
        - security
        - staging
        - production
        - rollback
        - diagnose_production
        - restart_production
      campaign_id:
        description: Controller campaign correlation ID
        required: true
        type: string
      execution_id:
        description: Unique BDI attempt identity
        required: true
        type: string
      attempt:
        description: BDI attempt number
        required: true
        type: string
      release_sha:
        description: Immutable application commit to execute
        required: true
        type: string
      failure_mode:
        description: Controlled experiment failure for this entity
        required: true
        default: none
        type: choice
        options:
        - none
        - force_failure
        - transient_failure
        - service_unavailable
        - infrastructure_failure
        - deployment_timeout
        - candidate_stopped
      experiment_mode:
        description: Payment behavior for the selected demo deployment
        required: true
        default: normal
        type: choice
        options:
        - normal
        - high_error_rate
        - request_faults
permissions:
  contents: read
  actions: read
concurrency:
  group: bdi-${{ inputs.campaign_id }}-${{ inputs.entity }}
  cancel-in-progress: false
jobs:
  build:
    name: Build entity
    if: inputs.entity == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Controlled transient failure
      if: inputs.failure_mode == 'transient_failure'
      run: exit 1
      working-directory: .
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: control
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_sha }}
        path: application
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: application/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Execute selected entity
      env:
        ENTITY: build
        FAILURE_MODE: ${{ inputs.failure_mode }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: bash ../control/scripts/execute-entity.sh
    defaults:
      run:
        working-directory: application
  test:
    name: Test entity
    if: inputs.entity == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U payment -d payment" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://payment:payment@localhost:5432/payment
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      RELEASE_SHA: ${{ inputs.release_sha }}
      FAILURE_MODE: ${{ inputs.scenario == 'test-failure' && 'force_failure' || inputs.scenario == 'transient-test-failure' && 'transient_failure' || 'none' }}
    steps:
    - name: Controlled transient failure
      if: inputs.failure_mode == 'transient_failure'
      run: exit 1
      working-directory: .
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: control
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_sha }}
        path: application
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: application/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Execute selected entity
      env:
        ENTITY: test
        FAILURE_MODE: ${{ inputs.failure_mode }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: bash ../control/scripts/execute-entity.sh
    defaults:
      run:
        working-directory: application
  security:
    name: Security entity
    if: inputs.entity == 'security'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Controlled transient failure
      if: inputs.failure_mode == 'transient_failure'
      run: exit 1
      working-directory: .
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: control
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_sha }}
        path: application
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: application/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Execute selected entity
      env:
        ENTITY: security
        FAILURE_MODE: ${{ inputs.failure_mode }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: bash ../control/scripts/execute-entity.sh
    defaults:
      run:
        working-directory: application
  staging:
    name: Staging entity
    if: inputs.entity == 'staging'
    runs-on:
    - self-hosted
    - linux
    - payment-deploy
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.failure_mode == 'deployment_timeout' && 1 || 20 }}
    environment: staging
    env:
      COMPOSE_PROJECT_NAME: payment-staging
      APP_PORT: 3001
      POSTGRES_PORT: 5433
      METRICS_PORT: 9465
      PROMETHEUS_PORT: 9091
      DEPLOYMENT_ENVIRONMENT: staging
      NODE_ENV: production
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      EXPERIMENT_MODE: ${{ inputs.experiment_mode }}
      CI_RUN_ID: ${{ inputs.execution_id }}
      MERCHANT_NAME: Staging Merchant
    steps:
    - name: Controlled transient failure
      if: inputs.failure_mode == 'transient_failure'
      run: exit 1
      working-directory: .
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: control
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_sha }}
        path: application
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: application/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Execute selected entity
      env:
        ENTITY: staging
        FAILURE_MODE: ${{ inputs.failure_mode }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: bash ../control/scripts/execute-entity.sh
    defaults:
      run:
        working-directory: application
  production:
    name: Production entity
    if: inputs.entity == 'production'
    runs-on:
    - self-hosted
    - linux
    - payment-deploy
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.failure_mode == 'deployment_timeout' && 1 || 20 }}
    environment: production
    env:
      COMPOSE_PROJECT_NAME: payment-production
      APP_PORT: 3000
      POSTGRES_PORT: 5432
      METRICS_PORT: 9464
      PROMETHEUS_PORT: 9090
      DEPLOYMENT_ENVIRONMENT: production
      NODE_ENV: production
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      EXPERIMENT_MODE: ${{ inputs.experiment_mode }}
      CI_RUN_ID: ${{ inputs.execution_id }}
      MERCHANT_NAME: Production Merchant
    steps:
    - name: Controlled transient failure
      if: inputs.failure_mode == 'transient_failure'
      run: exit 1
      working-directory: .
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: control
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_sha }}
        path: application
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: application/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Execute selected entity
      env:
        ENTITY: production
        FAILURE_MODE: ${{ inputs.failure_mode }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: bash ../control/scripts/execute-entity.sh
    defaults:
      run:
        working-directory: application
  rollback:
    name: Rollback entity
    if: inputs.entity == 'rollback'
    runs-on:
    - self-hosted
    - linux
    - payment-deploy
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.failure_mode == 'deployment_timeout' && 1 || 20 }}
    environment: production
    env:
      COMPOSE_PROJECT_NAME: payment-production
      APP_PORT: 3000
      POSTGRES_PORT: 5432
      METRICS_PORT: 9464
      PROMETHEUS_PORT: 9090
      DEPLOYMENT_ENVIRONMENT: production
      NODE_ENV: production
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_OUTCOME: succeeded
      EXPERIMENT_MODE: normal
      CI_RUN_ID: ${{ inputs.execution_id }}
      MERCHANT_NAME: Production Merchant
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: control
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_sha }}
        path: application
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: application/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Execute selected entity
      env:
        ENTITY: rollback
        FAILURE_MODE: ${{ inputs.failure_mode }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: bash ../control/scripts/execute-entity.sh
    defaults:
      run:
        working-directory: application
  diagnose_candidate:
    name: Diagnose candidate
    if: inputs.entity == 'diagnose_production'
    runs-on:
    - self-hosted
    - linux
    - payment-deploy
    timeout-minutes: 5
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    environment: production
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Execute mechanical candidate operation
      env:
        ENTITY: ${{ inputs.entity }}
        EXPECTED: ${{ inputs.target_execution_id }}
        DIAGNOSTIC_BINDING: ${{ inputs.diagnostic_binding }}
        WINDOW: ${{ inputs.verification_seconds }}
        FAILURE_MODE: ${{ inputs.failure_mode }}
      run: |
        action=diagnose
        args=()
        if [ "$ENTITY" = restart_production ]; then action=restart; fi
        if [ "$FAILURE_MODE" = force_failure ]; then args+=(--inject-restart-failure); fi
        python scripts/candidate-repair.py "$action" --bindings "$DIAGNOSTIC_BINDING" --expected "$EXPECTED" --verification-seconds "$WINDOW" --output evidence/receipt.json "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: repair-${{ inputs.execution_id }}
        path: evidence/receipt.json
        if-no-files-found: error
  restart_candidate:
    name: Restart candidate
    if: inputs.entity == 'restart_production'
    runs-on:
    - self-hosted
    - linux
    - payment-deploy
    timeout-minutes: 5
    concurrency:
      group: payment-deployment-control
      cancel-in-progress: false
    environment: production
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Execute mechanical candidate operation
      env:
        ENTITY: ${{ inputs.entity }}
        EXPECTED: ${{ inputs.target_execution_id }}
        DIAGNOSTIC_BINDING: ${{ inputs.diagnostic_binding }}
        WINDOW: ${{ inputs.verification_seconds }}
        FAILURE_MODE: ${{ inputs.failure_mode }}
      run: |
        action=diagnose
        args=()
        if [ "$ENTITY" = restart_production ]; then action=restart; fi
        if [ "$FAILURE_MODE" = force_failure ]; then args+=(--inject-restart-failure); fi
        python scripts/candidate-repair.py "$action" --bindings "$DIAGNOSTIC_BINDING" --expected "$EXPECTED" --verification-seconds "$WINDOW" --output evidence/receipt.json "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: repair-${{ inputs.execution_id }}
        path: evidence/receipt.json
        if-no-files-found: error
