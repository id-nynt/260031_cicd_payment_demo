plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url 'https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master' }
}

dependencies {
    implementation 'io.github.jason-lang:jason-interpreter:3.3.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'org.yaml:snakeyaml:2.5'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

sourceSets {
    main {
        java {
            srcDirs = ['.', '../monitoring', '../actions']
            exclude 'build/**'
            exclude 'src/test/**'
        }
    }
    test {
        java.srcDirs = ['src/test/java']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
}

tasks.register('runBaseline', JavaExec) {
    group = 'BDI'
    description = 'Run the generated agent against one observed GitHub workflow run; no deployment actions'
    dependsOn classes
    mainClass = 'jason.infra.local.RunLocalMAS'
    classpath = sourceSets.main.runtimeClasspath
    workingDir projectDir
    args 'project.mas2j', '--log-conf', 'logging.properties'
}

tasks.register('probeBaseline', JavaExec) {
    group = 'BDI'
    description = 'Read workflow state and payment telemetry without starting Jason'
    dependsOn classes
    mainClass = 'harness.ProjectBaselineProbe'
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('probeArgs')) {
        args project.property('probeArgs').toString().split(' ')
    }
}

tasks.register('gate', JavaExec) {
    group = 'BDI'
    description = 'One-shot Jason promotion gate: 0 allow, nonzero block or unknown'
    dependsOn classes
    mainClass = 'harness.ProjectGateMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir projectDir
}

tasks.register('runController', JavaExec) {
    group = 'BDI'
    description = 'Run the generated goal-directed CI/CD controller (no GUI)'
    dependsOn classes
    mainClass = 'harness.ControllerMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir projectDir
}
