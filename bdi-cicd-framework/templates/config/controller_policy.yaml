# Advanced project input. All execution fields are required; there are no hidden defaults.
# retry_safe: [] deliberately disables execution retries. Add only reviewed repeatable jobs.
# Observation and reconciliation are separate from execution retries.
# Review thresholds (error fraction, p95 milliseconds), timing, and recovery triggers.
execution:
  observation_attempts: 36
  observation_interval_seconds: 5
  observation_timeout_seconds: 180
  healthy_observations: 2
  retry_interval_seconds: 5
  reconciliation_attempts: 3
  reconciliation_interval_seconds: 5
  retry_safe: []
observation:
  before:
    production: staging
  after:
  - staging
  - production
  - rollback
recovery_policy:
  rollback:
    run_after:
    - failure
    - telemetry_block
    - telemetry_unknown
    - maintenance_violation
    release_source: known_good
    retryable: false
    verify_health: true
    terminal_on_success: restored
    terminal_on_failure: failed
telemetry_constraints:
  error_rate_high_gt: 0.05
  latency_p95_ms_high_gt: 500
