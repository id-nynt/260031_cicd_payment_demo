# Primary input: replace YOUR_APP/your-app; entity keys match goals and policy.
# job_name matches GitHub display names; needs lists prerequisite entities.
# Real job steps stay in the selected-entity worker.
name: YOUR_APP release pipeline
project: your-app
execution:
  max_retries: 1
workflow_file: entity-execution.yml
jobs:
  build:
    job_name: Build entity
  test:
    needs: build
    job_name: Test entity
  security:
    needs: test
    job_name: Security entity
  staging:
    needs: security
    job_name: Staging entity
    environment: staging
  production:
    needs: staging
    job_name: Production entity
    environment: production
recovery:
  rollback:
    job_name: Rollback entity
    environment: production
    from: production
