# Engineer input: replace YOUR_*, your-app and your_app_* before live use.
# Example topology: rename/add/remove jobs and update input 02 and the worker together.
name: YOUR_APP release pipeline
project: your-app
# Policy budgets: retry count excludes the initial execution; observation is separate.
execution:
  max_retries: 1
  observation_attempts: 36
  observation_interval_seconds: 5
  observation_timeout_seconds: 180
  healthy_observations: 2
  retry_interval_seconds: 5
  reconciliation_attempts: 3
  reconciliation_interval_seconds: 5
# Filename under .github/workflows in your target repository.
workflow_file: entity-execution.yml
# Keys are logical entity atoms (lowercase letters/digits/underscore).
# job_name must exactly match the GitHub job display name; steps stay in GitHub YAML.
jobs:
  build:
    # Set true only if repeating this action is safe for your application.
    retry_safe: true
    job_name: Build entity
  test:
    # Set true only if repeating this action is safe for your application.
    retry_safe: true
    # Prerequisite entity; also accepts a list. Jason schedules this dependency.
    needs: build
    job_name: Test entity
  security:
    # Set true only if repeating this action is safe for your application.
    retry_safe: true
    # Prerequisite entity; also accepts a list. Jason schedules this dependency.
    needs: test
    job_name: Security entity
  staging:
    # Set true only if repeating this action is safe for your application.
    retry_safe: true
    # Prerequisite entity; also accepts a list. Jason schedules this dependency.
    needs: security
    job_name: Staging entity
    environment: staging
    # Verify this environment with readiness and correlated Prometheus metrics.
    observe_after: true
  production:
    # Set true only if repeating this action is safe for your application.
    retry_safe: true
    # Prerequisite entity; also accepts a list. Jason schedules this dependency.
    needs: staging
    observe_before: staging
    job_name: Production entity
    environment: production
    # Verify this environment with readiness and correlated Prometheus metrics.
    observe_after: true
# Optional recovery mapping: separate from normal dependency edges.
# Implement rollback in the worker using the supplied verified known-good release SHA.
recovery:
  rollback:
    # Verify this environment with readiness and correlated Prometheus metrics.
    observe_after: true
    job_name: Rollback entity
    environment: production
    from: production
    'on':
    - failure
    - telemetry_block
    - telemetry_unknown
    - maintenance_violation
    release_source: known_good
# Addresses are reached FROM the controller; match your deployment port mappings.
telemetry:
  environments:
    staging:
      ready_url: http://YOUR_STAGING_HOST:3001/ready
      prometheus_url: http://YOUR_STAGING_HOST:9091
    production:
      ready_url: http://YOUR_PRODUCTION_HOST:3000/ready
      prometheus_url: http://YOUR_PRODUCTION_HOST:9090
# Replace metric names/route with real exported metrics; retain {{run_id}} correlation.
# Queries return error fraction, p95 milliseconds, availability (1 = ready), sample age seconds.
  metrics:
    error_rate_query: (sum(rate(your_app_http_errors_total{ci_run_id="{{run_id}}",route="/YOUR_ROUTE",status_code=~"5.."}[2m]))
      or vector(0)) / clamp_min(sum(rate(your_app_http_requests_total{ci_run_id="{{run_id}}",route="/YOUR_ROUTE"}[2m])),
      0.001)
    latency_p95_ms_query: histogram_quantile(0.95, sum by (le) (rate(your_app_http_request_duration_milliseconds_bucket{ci_run_id="{{run_id}}",route="/YOUR_ROUTE"}[2m])))
    availability_query: min(your_app_ready{ci_run_id="{{run_id}}"})
    sample_age_seconds_query: time() - max(timestamp(your_app_ready{ci_run_id="{{run_id}}"}))
  max_age_seconds: 30
