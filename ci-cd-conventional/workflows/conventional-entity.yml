name: Conventional entity with bounded retry
'on':
  workflow_call:
    inputs:
      entity:
        type: string
        required: true
      release_sha:
        type: string
        required: true
      failure_mode:
        type: string
        required: true
      experiment_mode:
        type: string
        required: true
      max_retries:
        type: number
        default: 1
      retry_seconds:
        type: number
        default: 5
    outputs:
      execution_id:
        value: ${{ jobs.result.outputs.execution_id }}
      status:
        value: ${{ jobs.result.outputs.status }}
permissions:
  contents: read
  actions: read
jobs:
  first:
    uses: ./.github/workflows/entity-execution.yml
    with:
      entity: ${{ inputs.entity }}
      campaign_id: native-${{ github.run_id }}-${{ github.run_attempt }}
      execution_id: native-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.entity }}-1
      attempt: '1'
      release_sha: ${{ inputs.release_sha }}
      failure_mode: ${{ inputs.failure_mode }}
      experiment_mode: ${{ inputs.experiment_mode }}
      report_only: true
  wait:
    needs: first
    if: ${{ always() && inputs.entity != 'rollback' && inputs.max_retries > 0 && (needs.first.outputs.status == 'transient_failure' || needs.first.outputs.status
      == 'timeout') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          SECONDS_TO_WAIT: ${{ inputs.retry_seconds }}
        run: sleep "$SECONDS_TO_WAIT"
  retry:
    uses: ./.github/workflows/entity-execution.yml
    with:
      entity: ${{ inputs.entity }}
      campaign_id: native-${{ github.run_id }}-${{ github.run_attempt }}
      execution_id: native-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.entity }}-2
      attempt: '2'
      release_sha: ${{ inputs.release_sha }}
      failure_mode: ${{ inputs.failure_mode == 'transient_failure' && 'none' || inputs.failure_mode }}
      experiment_mode: ${{ inputs.experiment_mode }}
      report_only: true
    needs:
      - first
      - wait
    if: ${{ always() && needs.wait.result == 'success' }}
  result:
    needs:
      - first
      - retry
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      execution_id: ${{ steps.result.outputs.execution_id }}
      status: ${{ steps.result.outputs.status }}
    steps:
      - id: result
        env:
          FIRST: ${{ needs.first.outputs.status }}
          SECOND: ${{ needs.retry.outputs.status }}
          RETRIED: ${{ needs.retry.result }}
          ENTITY: ${{ inputs.entity }}
        run: |-
          status="$FIRST"; attempt=1
          if [ "$RETRIED" != skipped ]; then status="$SECOND"; attempt=2; fi
          [ -n "$status" ] || status=unknown
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "execution_id=native-${{ github.run_id }}-${{ github.run_attempt }}-${ENTITY}-${attempt}" >> "$GITHUB_OUTPUT"
          echo "ENTITY $ENTITY = $status (attempt $attempt)"
          true # The caller gates on the explicit status output.
